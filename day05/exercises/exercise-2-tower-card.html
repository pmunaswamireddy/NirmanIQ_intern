<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Progress Card</title>
  <style>
* {
  box-sizing:border-box;
}
body {
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:16px;
}
h1 {
  text-align:center;
  margin-bottom:16px;
}
.card-container {
  display:flex;
  flex-direction:column;
  gap:12px;
  max-width:1050px;
  margin:0 auto;
}
.card {
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  padding:14px;
}
.card-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.card-header h2 {
  margin:0;
  font-size:17px;
}
.badge {
  padding:3px 8px;
  border-radius:10px;
  font-size:11px;
  font-weight:bold;
}
.badge-green { background:#e8f5e9; color:#2e7d32; }
.badge-amber { background:#fff8e1; color:#f57f17; }
.badge-red { background:#ffebee; color:#c62828; }
.details p {
  margin:3px 0;
  font-size:13px;
  color:#555;
}
.progress-info {
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:bold;
  margin:8px 0 4px;
}
.progress-bar {
  width:100%;
  height:9px;
  background:#e0e0e0;
  border-radius:4px;
  overflow:hidden;
  margin-bottom:12px;
}
.progress-fill { height:100%; }
.fill-green { width:75%; background:#4caf50; }
.fill-amber { width:50%; background:#ff9800; }
.fill-red { width:25%; background:#f44336; }
.btn {
  width:100%;
  padding:7px;
  background:#1976d2;
  color:white;
  border:none;
  border-radius:4px;
  font-size:13px;
  cursor:pointer;
}
@media (min-width:768px) {
  .card-container {
    flex-direction:row;
  }
  .card {
    flex:1;
  }
}
  </style>
</head>
<body>
  <h1>BuildTrack - Tower Progress</h1>
  <main class="card-container">
    <article class="card">
      <header class="card-header">
        <h2>Tower A</h2>
        <span class="badge badge-green">On Track</span>
      </header>
      <div class="details">
        <p><strong>Floors:</strong> 18 / 24</p>
        <p><strong>Workers:</strong> 42 on site</p>
        <p><strong>Target:</strong> Nov 2026</p>
      </div>
      <div class="progress-info"><span>Progress</span><span>75%</span></div>
      <div class="progress-bar"><div class="progress-fill fill-green"></div></div>
      <button class="btn" type="button">View Details</button>
    </article>
    <article class="card">
      <header class="card-header">
        <h2>Tower B</h2>
        <span class="badge badge-amber">At Risk</span>
      </header>
      <div class="details">
        <p><strong>Floors:</strong> 10 / 20</p>
        <p><strong>Workers:</strong> 28 on site</p>
        <p><strong>Target:</strong> Dec 2026</p>
      </div>
      <div class="progress-info"><span>Progress</span><span>50%</span></div>
      <div class="progress-bar"><div class="progress-fill fill-amber"></div></div>
      <button class="btn" type="button">View Details</button>
    </article>
    <article class="card">
      <header class="card-header">
        <h2>Tower C</h2>
        <span class="badge badge-red">Critical</span>
      </header>
      <div class="details">
        <p><strong>Floors:</strong> 2 / 8</p>
        <p><strong>Workers:</strong> 12 on site</p>
        <p><strong>Target:</strong> Jan 2027</p>
      </div>
      <div class="progress-info"><span>Progress</span><span>25%</span></div>
      <div class="progress-bar"><div class="progress-fill fill-red"></div></div>
      <button class="btn" type="button">View Details</button>
    </article>
  </main>
</body>
</html>
